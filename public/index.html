<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>网关 · 控制面板</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/_gateway/preferences.js"></script>
  <link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/" aria-label="网关首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 20.5a7 7 0 0 1 14 0"/><circle cx="16" cy="21" r="1.9"/><path d="M16 9.5v3.2"/></svg></span><span data-i18n="brand">网关</span><span class="brand-sub" data-i18n="brandSub"> / 控制面板</span></a><div class="top-actions"><span class="pill" data-i18n="topPill">单 Pod · 本地控制面</span><select id="lang" class="icon-button preference-select" data-i18n-aria="language"><option value="system" data-i18n="languageSystem">语言：跟随浏览器</option><option value="zh">中文</option><option value="en">English</option></select><select id="theme" class="icon-button preference-select" data-i18n-aria="theme"><option value="system" data-i18n="themeSystem">主题：跟随浏览器</option><option value="light" data-i18n="themeLight">浅色</option><option value="dark" data-i18n="themeDark">深色</option></select><button id="logout" class="icon-button" data-i18n="logout">退出</button></div></header>
    <main>
      <section class="intro"><div><p class="eyebrow">PROXY GATEWAY</p><h1><span data-i18n="h1a"></span><br class="mobile-break"><span data-i18n="h1b"></span></h1><p class="subtitle" data-i18n="subtitle"></p></div><div class="refresh-group"><span id="updated" class="muted" data-i18n="refreshing"></span><button id="refresh" class="button secondary"><span data-i18n="refresh"></span> <span aria-hidden="true">↻</span></button></div></section>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <section class="kpis" aria-label="网关实时指标">
        <article class="card kpi"><p data-i18n="kpiConnections"></p><div id="connections" class="figure">—</div><span id="mihomo-version" class="muted" data-i18n="kpiConnectionsHint"></span></article>
        <article class="card kpi"><p data-i18n="kpiDownload"></p><div id="download" class="figure">—</div><span class="muted" data-i18n="kpiTrafficHint"></span></article>
        <article class="card kpi"><p data-i18n="kpiUpload"></p><div id="upload" class="figure">—</div><span class="muted" data-i18n="kpiTrafficHint"></span></article>
        <article class="card kpi"><p data-i18n="kpiOnline"></p><div id="online" class="figure">—</div><span id="tailnet" class="muted" data-i18n="tailnetHint"></span></article>
      </section>
      <section class="services" aria-labelledby="services-title"><div class="section-heading"><h2 id="services-title" data-i18n="services"></h2><span class="muted" data-i18n="servicesHint"></span></div><div class="service-grid">
        <article class="card service"><div class="service-top"><span class="service-icon" aria-hidden="true">M</span><span id="mihomo-status" class="status unknown">○ 读取中</span></div><h3>mihomo</h3><p data-i18n="mihomoDesc"></p><a id="mihomo-link" class="service-link" href="https://mihomo.proxy.asterwyx.top/" target="_blank" rel="noopener"><span data-i18n="openMihomo"></span> <span aria-hidden="true">↗</span></a></article>
        <article class="card service"><div class="service-top"><span class="service-icon" aria-hidden="true">O</span><span id="oxidns-status" class="status unknown">○ 读取中</span></div><h3>OxiDNS</h3><p id="oxidns-probe" data-i18n="oxidnsDesc"></p><a class="service-link" href="https://oxidns.proxy.asterwyx.top/" target="_blank" rel="noopener"><span data-i18n="openOxidns"></span> <span aria-hidden="true">↗</span></a></article>
        <article class="card service"><div class="service-top"><span class="service-icon" aria-hidden="true">T</span><span id="tailscale-status" class="status unknown">○ 读取中</span></div><h3>Tailscale</h3><p id="tailscale-state" data-i18n="tailscaleDesc"></p><a class="service-link" href="#tailscale-controls"><span data-i18n="viewTailscale"></span> <span aria-hidden="true">↓</span></a></article>
      </div></section>
      <section class="card management" id="tailscale-controls" aria-labelledby="management-title"><div class="section-heading"><div><p class="eyebrow" data-i18n="mgmtEyebrow">TAILSCALE / LOCAL API</p><h2 id="management-title" data-i18n="mgmtTitle"></h2></div><span class="pill" data-i18n="mgmtPill"></span></div><p class="muted management-note" data-i18n="mgmtNote"></p><div class="controls">
        <div class="control"><div><h3 data-i18n="wantRunning"></h3><p data-i18n="wantRunningDesc"></p></div><button class="toggle" id="WantRunning" role="switch" aria-checked="false" aria-label="接入 tailnet" disabled><span></span></button></div>
        <div class="control"><div><h3 data-i18n="shieldsUp"></h3><p data-i18n="shieldsUpDesc"></p></div><button class="toggle" id="ShieldsUp" role="switch" aria-checked="false" aria-label="屏蔽传入连接" disabled><span></span></button></div>
        <div class="control"><div><h3 data-i18n="advertise"></h3><p><span data-i18n="advertiseDesc"></span> <code>198.20.0.0/16</code></p><p id="route-warning" class="route-warning" hidden></p></div><button class="toggle" id="AdvertiseRoutes" role="switch" aria-checked="false" aria-label="发布 fake-IP 路由" disabled><span></span></button></div>
      </div><p id="prefs-note" class="muted small" data-i18n="prefsUnavailable"></p></section>
      <section class="card nodes" aria-labelledby="nodes-title"><div class="section-heading"><div><h2 id="nodes-title" data-i18n="nodes"></h2><p class="muted small" data-i18n="nodesDesc"></p></div><span id="node-count" class="pill" data-i18n="pending"></span></div><div class="table-wrap" tabindex="0" aria-label="tailnet 节点表，可横向滚动"><table><thead><tr><th scope="col" data-i18n="colName"></th><th scope="col" data-i18n="colIp"></th><th scope="col" data-i18n="colState"></th><th scope="col" data-i18n="colOs"></th><th scope="col" data-i18n="colSeen"></th><th scope="col" data-i18n="colTraffic"></th></tr></thead><tbody id="nodes-body"><tr><td colspan="6" class="empty" data-i18n="nodesLoading"></td></tr></tbody></table></div></section>
    </main>
    <footer><span data-i18n="footer"></span><span data-i18n="footerHint"></span></footer>
  </div>
  <dialog id="confirm"><form method="dialog"><p class="eyebrow" data-i18n="confirmEyebrow">确认 tailnet 修改</p><h2 id="confirm-title"></h2><p id="confirm-description"></p><p class="muted small" data-i18n="confirmNote"></p><div class="dialog-actions"><button class="button secondary" value="cancel" data-i18n="cancel"></button><button class="button" value="apply" data-i18n="apply"></button></div></form></dialog>
</body>
</html>
